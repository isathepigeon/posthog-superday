  <style>
    body {
      font-family: Verdana, sans-serif;
      background: #f4e3c1;
      color: #2b1a0e;
      max-width: 620px;
      margin: 40px auto;
      padding: 0 20px;
    }
    .card {
      background: #fff;
      border: 3px solid #2b1a0e;
      box-shadow: 6px 6px 0 #2b1a0e;
      padding: 24px;
      margin-bottom: 24px;
    }
    h1 { margin-top: 0; }
    .lab-note {
      background: #ffe08a;
      border: 2px dashed #2b1a0e;
      padding: 10px 14px;
      font-size: 13px;
    }
    button {
      font-family: inherit;
      font-size: 15px;
      font-weight: bold;
      padding: 12px 18px;
      margin: 6px 6px 6px 0;
      border: 3px solid #2b1a0e;
      box-shadow: 3px 3px 0 #2b1a0e;
      cursor: pointer;
    }
    button:active { transform: translate(3px, 3px); box-shadow: none; }
    #login    { background: #8ecae6; }
    #add      { background: #b7e4c7; }
    #checkout { background: #ffb4a2; }
    #logout   { background: #e0e0e0; }
    #status {
      margin-top: 18px;
      padding: 12px;
      background: #2b1a0e;
      color: #ffe08a;
      font-size: 14px;
    }

    <button id="add">Add to cart</button>
    <button id="checkout">Checkout</button>
    <button id="logout">Log out</button>

    <div id="status">Not logged in</div>
  </div>

  <script type="module" src="/lab.js"></script>
